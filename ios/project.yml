# XcodeGen proje tanımı: `xcodegen generate` → TopPotada.xcodeproj
# (Xcode projesi depoya konmaz; Codemagic ve GitHub Actions derlemeden önce üretir.)
name: TopPotada
options:
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: tr
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
targets:
  TopPotada:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Sources
      - path: Resources
      # oyunun kendisi: Android'deki gibi public/ klasörü uygulamanın içine kopyalanır
      - path: ../public
        type: folder
        buildPhase: resources
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
      - package: GoogleSignIn
    entitlements:
      path: Sources/TopPotada.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Top Potada
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen:
          UIColorName: LaunchBG
        GIDClientID: $(TP_GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: google
            CFBundleURLSchemes: [$(TP_GOOGLE_REVERSED_CLIENT_ID)]
        GADApplicationIdentifier: $(TP_ADMOB_APP_ID)
        TPAdInterstitial: $(TP_AD_INTERSTITIAL)
        TPAdRewarded: $(TP_AD_REWARDED)
        NSUserTrackingUsageDescription: Reklamları sana daha uygun hale getirmek için kullanılır. İzin vermesen de oyunun tamamını oynayabilirsin.
        SKAdNetworkItems:
