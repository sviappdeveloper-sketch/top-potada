name: Android APK
on:
  push:
    branches: [main]
    paths: ['public/**', 'android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Oyun dosyalarını APK içine kopyala
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r public/. android/app/src/main/assets/www/
          rm -rf android/app/src/main/assets/www/.well-known
      - name: APK derle
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: APK'yı apk dalına koy
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/TopPotada.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rf --quiet .
          cp /tmp/TopPotada.apk TopPotada.apk
          echo "Derleme: ${GITHUB_SHA}" > SURUM.txt
          git add TopPotada.apk SURUM.txt
          git commit -m "APK ${GITHUB_SHA::7}"
          git push -f origin apk
