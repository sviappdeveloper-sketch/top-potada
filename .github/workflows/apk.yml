name: Android APK + AAB
on:
  push:
    branches: [main]
    paths: ['public/**', 'android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Oyun dosyalarını uygulamanın içine kopyala
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r public/. android/app/src/main/assets/www/
          rm -rf android/app/src/main/assets/www/.well-known
      - name: Deneme APK'sı ve Play Store paketi (imzasız AAB) derle
        working-directory: android
        run: gradle --no-daemon assembleDebug bundleRelease
      # Play Store yükleme anahtarı GitHub gizli ayarlarında varsa (PLAY_KEYSTORE_B64, PLAY_KEYSTORE_PASS)
      # AAB imzalanır ve apk dalına TopPotada-play.aab olarak konur. Anahtar depoya hiç yazılmaz.
      - name: Play Store paketini imzala (anahtar varsa)
        env:
          KS_B64: ${{ secrets.PLAY_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.PLAY_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > /tmp/upload.jks
            cp android/app/build/outputs/bundle/release/app-release.aab /tmp/TopPotada-play.aab
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore /tmp/upload.jks -storepass "$KS_PASS" -keypass "$KS_PASS" /tmp/TopPotada-play.aab upload
            jarsigner -verify /tmp/TopPotada-play.aab | grep -q "jar verified"
            rm -f /tmp/upload.jks
          else
            echo "Play anahtarı tanımlı değil; imzalı AAB atlandı."
          fi
      - name: Çıktıları apk dalına koy
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/TopPotada.apk
          cp android/app/build/outputs/bundle/release/app-release.aab /tmp/TopPotada-imzasiz.aab
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rf --quiet .
          cp /tmp/TopPotada.apk /tmp/TopPotada-imzasiz.aab .
          if [ -f /tmp/TopPotada-play.aab ]; then cp /tmp/TopPotada-play.aab .; fi
          echo "Derleme: ${GITHUB_SHA}" > SURUM.txt
          git add TopPotada.apk TopPotada-imzasiz.aab SURUM.txt
          if [ -f TopPotada-play.aab ]; then git add TopPotada-play.aab; fi
          git commit -m "Derleme ${GITHUB_SHA::7}"
          git push -f origin apk
